name: Open Compute binaries

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag, for example v1.20260930.0-open-compute-r4.012345678
        required: true
        type: string
      recover_r23:
        description: Reuse the three verified R23 artifacts and rebuild only macOS x64
        required: false
        type: boolean
        default: false

      publish_r23:
        description: Publish the four retained R23 build artifacts without compiling
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !inputs.publish_r23 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.recover_r23 && '[{"runner":"macos-15","target":"darwin-x64","config":"release_macos_cross_x86_64"}]' || '[{"runner":"ubuntu-24.04","target":"linux-x64","config":"release_linux"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64","config":"release_linux"},{"runner":"macos-15","target":"darwin-arm64","config":"release_macos"},{"runner":"macos-15","target":"darwin-x64","config":"release_macos_cross_x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.recover_r23 && '25f2a0fded9744c65988880e6c2003434aa90d3b' || github.sha }}
      - name: Verify R23 reusable artifacts
        if: inputs.recover_r23
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          python3 - <<'PYTHON'
          import datetime
          import json
          import os
          from pathlib import Path
          import subprocess

          REVISION = "25f2a0fded9744c65988880e6c2003434aa90d3b"
          RUN = 40199209196
          EXPECTED = {
              "workerd-linux-x64": (12605877244, "831c155f22184ba35d344d85932db3919ba5cdafa1026c4b384e0b866df2bde3"),
              "workerd-darwin-arm64": (12604054660, "7a88c9b1f6325122c83c3e43daa1e071f278da112b10d34c0487440bf83fbaa7"),
              "workerd-linux-arm64": (12603164530, "7407ce2e663cd063b71e2312e75305d26571a28e8b49fdf16ffb622f0a97a3ba"),
          }
          BUILD_JOBS = {
              "workerd-linux-x64": "build (ubuntu-24.04, linux-x64, release_linux)",
              "workerd-darwin-arm64": "build (macos-15, darwin-arm64, release_macos)",
              "workerd-linux-arm64": "build (ubuntu-24.04-arm, linux-arm64, release_linux)",
          }
          REQUIRED = {
              "Check Tokio I/O graph", "Build", "Qualify native Container callbacks and attachment",
              "Check native Tokio Rust style and lints", "Qualify Tokio reactor fairness and native I/O",
              "Qualify Root ownership across native Container executions", "Record inputs",
              "Verify private Container protocol", "Record compatibility catalog",
          }

          def validate(run, jobs, artifacts):
              assert run["id"] == RUN and run["run_attempt"] == 1 and run["head_sha"] == REVISION
              assert run["repository"]["full_name"] == "elliothux/workerd"
              assert run["path"] == ".github/workflows/open-compute-binaries.yml"
              assert run["event"] == "workflow_dispatch" and run["head_branch"] == "main"
              assert run["status"] == "completed" and run["conclusion"] == "failure"
              assert jobs["total_count"] == len(jobs["jobs"]) == 5
              assert all(job["status"] == "completed" and job["head_sha"] == REVISION and
                         job["run_id"] == RUN and job["run_attempt"] == 1 for job in jobs["jobs"])
              by_name = {job["name"]: job for job in jobs["jobs"]}
              assert len(by_name) == 5
              assert set(by_name) == set(BUILD_JOBS.values()) | {
                  "build (macos-15, darwin-x64, release_macos_cross_x86_64)", "publish"}
              assert artifacts["total_count"] == len(artifacts["artifacts"]) == 3
              assert {a["name"] for a in artifacts["artifacts"]} == set(EXPECTED)
              result = {}
              for asset in artifacts["artifacts"]:
                  name = asset["name"]
                  identifier, digest = EXPECTED[name]
                  assert asset["id"] == identifier and asset["digest"] == "sha256:" + digest
                  assert asset["expired"] is False and 0 < asset["size_in_bytes"] < 64 * 1024**2
                  assert datetime.datetime.fromisoformat(asset["expires_at"].replace("Z", "+00:00")) > datetime.datetime.now(datetime.timezone.utc)
                  assert asset["workflow_run"]["id"] == RUN and asset["workflow_run"]["head_sha"] == REVISION
                  job = by_name[BUILD_JOBS[name]]
                  assert job["conclusion"] == "success"
                  steps = {step["name"]: step for step in job["steps"]}
                  assert len(steps) == len(job["steps"]) and REQUIRED <= set(steps)
                  assert all(steps[name]["status"] == "completed" and steps[name]["conclusion"] == "success" for name in REQUIRED)
                  result[name] = {"artifactId": identifier, "archiveSha256": digest, "jobId": job["id"]}
              return {"r23ReusableArtifacts": {"sourceRevision": REVISION, "run": RUN,
                      "sourceRunConclusion": "failure", "qualifiedTargetsOnly": result}}

          def main():
              assert os.environ["GITHUB_REPOSITORY"] == "elliothux/workerd"
              assert os.environ["RELEASE"] == "v1.20260930.0-open-compute-r23.25f2a0fde"
              assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == REVISION
              assert not subprocess.check_output(["git", "status", "--porcelain"])
              records = []
              for suffix in ["", "/jobs?per_page=100", "/artifacts?per_page=100"]:
                  records.append(json.loads(subprocess.check_output(["gh", "api", f"repos/elliothux/workerd/actions/runs/{RUN}{suffix}"])))
              proof = validate(*records)
              (Path(os.environ["RUNNER_TEMP"]) / "r23-reuse-proof.json").write_text(json.dumps(proof, separators=(",", ":")) + "\n")

          if __name__ == "__main__":
              main()
          PYTHON
      - uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''
      - name: Configure macOS linker
        if: runner.os == 'macOS'
        run: |
          brew install lld
          sudo ln -s -f "$(brew --prefix lld)/bin/ld64.lld" /usr/local/bin/ld64.lld
          echo "build:macos --config=macos_lld_icf" >> .bazelrc
      - name: Check Tokio I/O graph
        run: ./build/rust_io_graph_check.sh --config=${{ matrix.config }}
      - name: Build
        run: >-
          bazel build //src/workerd/server:workerd
          --strip=always
          --config=${{ matrix.config }}
          --@rules_rust//:extra_exec_rustc_flags=-Cstrip=none
      - name: Qualify native Container callbacks and attachment
        run: >-
          bazel test
          //src/workerd/server:host-container-test@
          //src/workerd/server:container-client-test@
          //src/workerd/api:container-test@
          //src/workerd/api/tests:worker-loader-host-container-test@
          //src/workerd/api:sockets-test@
          //src/workerd/api/tests:socket-close-gc-test@
          //src/workerd/api/tests:outbound-interceptor-socket-test@
          --strip=always
          --config=${{ matrix.config }}
          --@rules_rust//:extra_exec_rustc_flags=-Cstrip=none
          --test_output=errors
      - name: Check native Tokio Rust style and lints
        run: >-
          bazel build //src/rust/cxx/kj-rs-tokio
          --strip=always
          --config=${{ matrix.config }}
          --@rules_rust//:extra_exec_rustc_flags=-Cstrip=none
          --config=clippy
          --config=rustfmt
          --@rules_rust//:extra_rustc_flag=-Dwarnings
      - name: Qualify Tokio reactor fairness and native I/O
        run: >-
          bazel test
          //src/rust/...
          //src/rust/cxx/kj-rs-tokio/tests:tokio-event-port-test
          //src/rust/cxx/kj-rs-tokio:kj-rs-tokio_test
          //src/rust/cxx/kj-rs-io:kj-rs-io_test
          //src/rust/cxx/kj-rs-io/tests:async-io-test
          //src/rust/cxx/kj-rs-io/tests:file-watcher-test
          //src/rust/cxx/kj-rs-io/tests:http-test
          //src/rust/cxx/kj-rs-io/tests:peer-filter-test
          //src/rust/cxx/kj-rs-io/tests:capnp-rpc-test
          --strip=always
          --config=${{ matrix.config }}
          --@rules_rust//:extra_exec_rustc_flags=-Cstrip=none
          --test_output=errors
      - name: Qualify Root ownership across native Container executions
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          names = [
              "Server: Private Container named images are immutable and class scoped",
              "Server: Automatic Container monitoring does not prevent inactivity",
              "Server: Host Container monitor retains its owner across the idle window",
              "Server: Host Container snapshot retains fresh owner I/O after lease policy",
              "Server: Host warm start registers callbacks for a previously constructed cold facet",
              "Server: Old execution retirement preserves the current owner's outbound callbacks",
              "Server: Shared outbound mappings survive completed stop and client replacement",
              "Server: Private Container inactivity survives idle and positively stops its lease",
              "Server: Active egress delays inactivity; unused reverse channels do not",
              "Server: Ordinary tenant waitUntil outlasts the monitor owner window",
              "Server: Default Container inactivity positively stops without an explicit setter",
          ]
          source = Path("src/workerd/server/server-test.c++").read_text().splitlines()
          filters = []
          expected = []
          for name in names:
              lines = [line for line, value in enumerate(source, 1)
                       if value == f'KJ_TEST("{name}") {{']
              if len(lines) != 1:
                  raise SystemExit("Native owner regression source inventory is ambiguous")
              filters.extend(["-f", f"server-test.c++:{lines[0]}"])
              expected.append(f"[ TEST ] server-test.c++:{lines[0]}: {name}")
          flags = ["--strip=always", "--config=" + os.environ["BAZEL_CONFIG"],
                   "--@rules_rust//:extra_exec_rustc_flags=-Cstrip=none"]
          subprocess.run(["bazel", "build", "//src/workerd/server:server-test_binary", *flags], check=True)
          listed = subprocess.run(["bazel-bin/src/workerd/server/server-test_binary", "--list", *filters],
                                  capture_output=True, text=True, check=True)
          if sorted(listed.stdout.splitlines()) != sorted(expected) or listed.stderr:
              raise SystemExit("Native owner regression binary inventory does not match source")
          print(listed.stdout, end="", flush=True)
          subprocess.run(["bazel", "test", "//src/workerd/server:server-test@", *flags,
                          *["--test_arg=" + value for value in filters], "--test_output=all"], check=True)
          PYTHON
      - name: Record inputs
        run: |
          bazel --version > build-inputs.txt
          clang --version >> build-inputs.txt 2>&1 || true
          ld.lld --version >> build-inputs.txt 2>&1 || true
          xcrun --show-sdk-version >> build-inputs.txt 2>&1 || true
          bazel-bin/src/workerd/server/workerd --version >> build-inputs.txt
          shasum -a 256 bazel-bin/src/workerd/server/workerd >> build-inputs.txt
          if [ "${{ inputs.recover_r23 }}" = "true" ]; then
            printf 'source-revision 25f2a0fded9744c65988880e6c2003434aa90d3b\nworkflow-revision %s\n' "$GITHUB_SHA" >> build-inputs.txt
            cat "$RUNNER_TEMP/r23-reuse-proof.json" >> build-inputs.txt
          fi
      - name: Verify private Container protocol
        run: |
          bazel-bin/src/workerd/server/workerd container-protocol-version > container-protocol.stdout 2> container-protocol.stderr
          test ! -s container-protocol.stderr
          printf 'open-compute-container-protocol-v4\n' > container-protocol.expected
          cmp container-protocol.expected container-protocol.stdout
          cat container-protocol.stdout >> build-inputs.txt
      - name: Record compatibility catalog
        run: |
          bazel-bin/src/workerd/server/workerd compatibility-catalog > compatibility-catalog.json 2> compatibility-catalog.stderr
          test ! -s compatibility-catalog.stderr
          bazel-bin/src/workerd/server/workerd compatibility-catalog > compatibility-catalog.second.json
          cmp compatibility-catalog.json compatibility-catalog.second.json
          if bazel-bin/src/workerd/server/workerd compatibility-catalog unexpected > compatibility-catalog.unexpected.stdout 2> compatibility-catalog.unexpected.stderr; then
            exit 1
          fi
          test ! -s compatibility-catalog.unexpected.stdout
          test -s compatibility-catalog.unexpected.stderr
          shasum -a 256 compatibility-catalog.json >> build-inputs.txt
      - uses: actions/upload-artifact@v7
        with:
          name: workerd-${{ matrix.target }}
          path: |
            bazel-bin/src/workerd/server/workerd
            build-inputs.txt
            compatibility-catalog.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ always() && ((!inputs.publish_r23 && needs.build.result == 'success') || (inputs.publish_r23 && inputs.recover_r23 && needs.build.result == 'skipped')) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.recover_r23 && '25f2a0fded9744c65988880e6c2003434aa90d3b' || github.sha }}
      - name: Verify retained R23 build artifacts
        if: inputs.publish_r23
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          python3 - <<'PYTHON'
          import datetime
          import json
          import os
          from pathlib import Path
          import subprocess

          EXPECTED = {'workerd-linux-x64': {'artifactId': 12605877244, 'archiveSha256': 'sha256:831c155f22184ba35d344d85932db3919ba5cdafa1026c4b384e0b866df2bde3', 'runId': 40199209196, 'workflowRevision': '25f2a0fded9744c65988880e6c2003434aa90d3b', 'jobId': 121186569660}, 'workerd-darwin-arm64': {'artifactId': 12604054660, 'archiveSha256': 'sha256:7a88c9b1f6325122c83c3e43daa1e071f278da112b10d34c0487440bf83fbaa7', 'runId': 40199209196, 'workflowRevision': '25f2a0fded9744c65988880e6c2003434aa90d3b', 'jobId': 121186569431}, 'workerd-linux-arm64': {'artifactId': 12603164530, 'archiveSha256': 'sha256:7407ce2e663cd063b71e2312e75305d26571a28e8b49fdf16ffb622f0a97a3ba', 'runId': 40199209196, 'workflowRevision': '25f2a0fded9744c65988880e6c2003434aa90d3b', 'jobId': 121186569657}, 'workerd-darwin-x64': {'artifactId': 12610838358, 'archiveSha256': 'sha256:23f8fdcce4f596470788d84e3d172e4a2d5ef5beddd4083cd8ccf89c481e04d9', 'runId': 40216315540, 'workflowRevision': 'e1e632f1c7eab06e3ab233774753ff4c8aaafcaf', 'jobId': 121238099808}}
          REQUIRED = {
              "Check Tokio I/O graph", "Build", "Qualify native Container callbacks and attachment",
              "Check native Tokio Rust style and lints", "Qualify Tokio reactor fairness and native I/O",
              "Qualify Root ownership across native Container executions", "Record inputs",
              "Verify private Container protocol", "Record compatibility catalog",
          }
          NAMES = {
              "workerd-linux-x64": "build (ubuntu-24.04, linux-x64, release_linux)",
              "workerd-linux-arm64": "build (ubuntu-24.04-arm, linux-arm64, release_linux)",
              "workerd-darwin-arm64": "build (macos-15, darwin-arm64, release_macos)",
              "workerd-darwin-x64": "build (macos-15, darwin-x64, release_macos_cross_x86_64)",
          }

          def validate(name, asset, job):
              expected = EXPECTED[name]
              assert asset["id"] == expected["artifactId"] and asset["name"] == name
              assert asset["digest"] == expected["archiveSha256"] and asset["expired"] is False
              assert 0 < asset["size_in_bytes"] < 64 * 1024**2
              assert datetime.datetime.fromisoformat(asset["expires_at"].replace("Z", "+00:00")) > datetime.datetime.now(datetime.timezone.utc)
              assert asset["workflow_run"]["id"] == expected["runId"]
              assert asset["workflow_run"]["head_sha"] == expected["workflowRevision"]
              assert job["id"] == expected["jobId"] and job["name"] == NAMES[name]
              assert job["run_id"] == expected["runId"] and job["head_sha"] == expected["workflowRevision"]
              assert job["run_attempt"] == 1 and job["status"] == "completed" and job["conclusion"] == "success"
              steps = {step["name"]: step for step in job["steps"]}
              assert len(steps) == len(job["steps"]) and REQUIRED <= set(steps)
              assert all(steps[key]["status"] == "completed" and steps[key]["conclusion"] == "success" for key in REQUIRED)
              if name == "workerd-darwin-x64":
                  assert steps["Verify R23 reusable artifacts"]["conclusion"] == "success"

          def main():
              assert os.environ["GITHUB_REPOSITORY"] == "elliothux/workerd"
              assert os.environ["RELEASE"] == "v1.20260930.0-open-compute-r23.25f2a0fde"
              assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == "25f2a0fded9744c65988880e6c2003434aa90d3b"
              assert not subprocess.check_output(["git", "status", "--porcelain"])
              for name, expected in EXPECTED.items():
                  asset = json.loads(subprocess.check_output(["gh", "api", f"repos/elliothux/workerd/actions/artifacts/{expected['artifactId']}"]))
                  job = json.loads(subprocess.check_output(["gh", "api", f"repos/elliothux/workerd/actions/jobs/{expected['jobId']}"]))
                  validate(name, asset, job)

          if __name__ == "__main__":
              main()
          PYTHON
      - uses: actions/download-artifact@v8
        if: inputs.recover_r23
        with:
          github-token: ${{ github.token }}
          repository: elliothux/workerd
          run-id: 40199209196
          artifact-ids: 12605877244,12604054660,12603164530
          path: artifacts
      - uses: actions/download-artifact@v8
        if: inputs.publish_r23
        with:
          github-token: ${{ github.token }}
          repository: elliothux/workerd
          run-id: 40216315540
          artifact-ids: 12610838358
          path: artifacts/workerd-darwin-x64
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.publish_r23 }}
        with:
          pattern: workerd-*
          path: ${{ inputs.recover_r23 && 'artifacts/workerd-darwin-x64' || 'artifacts' }}
      - name: Validate and package release assets
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-open-compute-[A-Za-z0-9._-]+$ ]]
          mapfile -t catalogs < <(find artifacts -name compatibility-catalog.json -type f | sort)
          test "${#catalogs[@]}" -eq 4
          for catalog in "${catalogs[@]:1}"; do
            cmp "${catalogs[0]}" "$catalog"
          done
          mkdir release
          cp "${catalogs[0]}" release/compatibility-catalog.json
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            binary="artifacts/workerd-$target/bazel-bin/src/workerd/server/workerd"
            test -f "$binary"
            case "$target" in
              darwin-x64) archive=workerd-darwin-64.gz ;;
              linux-x64) archive=workerd-linux-64.gz ;;
              *) archive="workerd-$target.gz" ;;
            esac
            gzip -9n -c "$binary" > "release/$archive"
            cp "artifacts/workerd-$target/build-inputs.txt" "release/build-inputs-$target.txt"
          done
          (
            cd release
            sha256sum workerd-*.gz compatibility-catalog.json build-inputs-*.txt > SHA256SUMS
          )
      - name: Publish immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          release_source_revision="${{ inputs.recover_r23 && '25f2a0fded9744c65988880e6c2003434aa90d3b' || github.sha }}"
          target_args=(--target "$release_source_revision")
          if [ "${{ inputs.recover_r23 }}" = "true" ]; then
            test "$(gh api "repos/elliothux/workerd/git/ref/tags/$RELEASE" --jq .object.sha)" = "$release_source_revision"
            target_args=(--verify-tag)
          fi
          gh release create "$RELEASE" \
          release/workerd-darwin-arm64.gz \
          release/workerd-darwin-64.gz \
          release/workerd-linux-arm64.gz \
          release/workerd-linux-64.gz \
          release/compatibility-catalog.json \
          release/build-inputs-darwin-arm64.txt \
          release/build-inputs-darwin-x64.txt \
          release/build-inputs-linux-arm64.txt \
          release/build-inputs-linux-x64.txt \
          release/SHA256SUMS \
          "${target_args[@]}" \
          --title "$RELEASE" \
          --notes "Four-platform open-compute workerd build from $release_source_revision."
